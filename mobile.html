<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث الشاشة - المشاهدة من الجوال</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 10px; margin: 0; }
        .card { background: #1e293b; max-width: 600px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background: #2563eb; }
        #status { margin-top: 15px; font-weight: bold; color: #38bdf8; }
        video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; }
    </style>
</head>
<body>
    <div class="card">
        <h2>شاشة العرض (المُستقبِل)</h2>
        <p>اضغط على زر الاتصال لمشاهدة الشاشة المُبثّة من اللابتوب فوراً.</p>
        <button id="connectBtn">الاتصال بالبث</button>
        <div id="status">الحالة: بانتظار الاتصال</div>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkFJ-aS-FxYaCqA-ZlN4m9VrFAbqgNbio",
            authDomain: "screen-share-e20d2.firebaseapp.com",
            projectId: "screen-share-e20d2",
            storageBucket: "screen-share-e20d2.firebasestorage.app",
            messagingSenderId: "591540534897",
            appId: "1:591540534897:web:a9a1a3fd4eaeffbfb1a5d0",
            measurementId: "G-BTREJKXSJ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');

        let pc;
        const roomCode = "default-room";

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        connectBtn.onclick = async () => {
            try {
                connectBtn.disabled = true;
                statusDiv.innerText = "الحالة: جارٍ الاتصال وجلب البث...";

                pc = new RTCPeerConnection(servers);

                pc.ontrack = event => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteVideo.srcObject = event.streams[0];
                    });
                };

                const roomRef = doc(db, 'rooms', roomCode);
                const roomSnapshot = await getDoc(roomRef);

                if (!roomSnapshot.exists()) {
                    statusDiv.innerText = "خطأ: لا يوجد بث نشط حالياً تأكد أن اللابتوب بدأ البث!";
                    connectBtn.disabled = false;
                    return;
                }

                const offerCandidates = collection(roomRef, 'offerCandidates');
                const answerCandidates = collection(roomRef, 'answerCandidates');

                pc.onicecandidate = event => {
                    if (event.candidate) {
                        addDoc(answerCandidates, event.candidate.toJSON());
                    }
                };

                const roomData = roomSnapshot.data();
                const offer = roomData.offer;
                await pc.setRemoteDescription(new RTCSessionDescription(offer));

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                const roomWithAnswer = { answer: { type: answer.type, sdp: answer.sdp } };
                await updateDoc(roomRef, roomWithAnswer);
                statusDiv.innerText = "الحالة: تم الاتصال بنجاح وعرض البث!";

                onSnapshot(offerCandidates, snapshot => {
                    snapshot.docChanges().forEach(async change => {
                        if (change.type === 'added') {
                            let data = change.doc.data();
                            await pc.addIceCandidate(new RTCIceCandidate(data));
                        }
                    });
                });

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "خطأ في الاتصال: " + err.message;
                connectBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
