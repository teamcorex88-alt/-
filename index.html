<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث الشاشة - الجهاز المُرسِل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; max-width: 500px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #22c55e; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background: #16a34a; }
        #status { margin-top: 15px; font-weight: bold; color: #38bdf8; }
        video { width: 100%; margin-top: 15px; border-radius: 8px; background: #000; }
    </style>
</head>
<body>
    <div class="card">
        <h2>بث الشاشة المباشر (المُرسِل)</h2>
        <p>اضغط على الزر أدناه لاختيار الشاشة أو النافذة وبدء البث الفوري عالمياً.</p>
        <button id="startBtn">بدء بث الشاشة</button>
        <div id="status">الحالة: متوقف</div>
        <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkFJ-aS-FxYaCqA-ZlN4m9VrFAbqgNbio",
            authDomain: "screen-share-e20d2.firebaseapp.com",
            projectId: "screen-share-e20d2",
            storageBucket: "screen-share-e20d2.firebasestorage.app",
            messagingSenderId: "591540534897",
            appId: "1:591540534897:web:a9a1a3fd4eaeffbfb1a5d0",
            measurementId: "G-BTREJKXSJ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const localVideo = document.getElementById('localVideo');

        let pc;
        let localStream;
        const roomCode = "default-room"; // كود الغرفة الثابت للاتصال السريع

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        startBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                startBtn.disabled = true;
                statusDiv.innerText = "الحالة: جارٍ الاتصال بالسحابة...";

                pc = new RTCPeerConnection(servers);

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                const roomRef = doc(db, 'rooms', roomCode);
                const offerCandidates = collection(roomRef, 'offerCandidates');
                const answerCandidates = collection(roomRef, 'answerCandidates');

                pc.onicecandidate = event => {
                    if (event.candidate) {
                        addDoc(offerCandidates, event.candidate.toJSON());
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const roomWithOffer = {
                    offer: {
                        type: offer.type,
                        sdp: offer.sdp,
                    },
                };
                await setDoc(roomRef, roomWithOffer);
                statusDiv.innerText = "الحالة: بانتظار اتصال الجوال (Client)...";

                onSnapshot(roomRef, async snapshot => {
                    const data = snapshot.data();
                    if (!pc.currentRemoteDescription && data && data.answer) {
                        const answer = new RTCSessionDescription(data.answer);
                        await pc.setRemoteDescription(answer);
                        statusDiv.innerText = "الحالة: متصل بنجاح وبث الشاشة يعمل!";
                    }
                });

                onSnapshot(answerCandidates, snapshot => {
                    snapshot.docChanges().forEach(async change => {
                        if (change.type === 'added') {
                            let data = change.doc.data();
                            await pc.addIceCandidate(new RTCIceCandidate(data));
                        }
                    });
                });

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "خطأ في بدء البث: " + err.message;
            }
        };
    </script>
</body>
</html>
